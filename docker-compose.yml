version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: app/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./backend/app:/app
    networks:
      - reviewlens-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
    depends_on:
      - backend
    networks:
      - reviewlens-network

networks:
  reviewlens-network:
    driver: bridge
